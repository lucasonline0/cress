name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: bash test/install/install.test.sh
      - run: npm run desktop:build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
      - run: npm run desktop:package -- --publish never
      - if: runner.os == 'Linux'
        run: xvfb-run -a env CRESS_PACKAGED_EXECUTABLE="$PWD/release/linux-unpacked/cress" node desktop/test/gui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cress-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cress-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          appimage="release-assets/Cress-$version.AppImage"
          test -s "$appimage"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published assets."
            exit 0
          fi
          (cd release-assets && sha256sum "Cress-$version.AppImage" > "Cress-$version.AppImage.sha256")
          mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.sha256' -o -name '*.exe' -o -name '*.zip' \) -print0)
          test "${#assets[@]}" -ge 2
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "Cress $version" --notes "New: Access Matrix to document expected authorization by role and endpoint, Test Studio to generate editable authorization test templates, and Coverage & Drift to compare observed routes with OpenAPI. Includes existing authorization review, policies and cress check CI support for NestJS, Next.js and Go/Chi. Packages are unsigned; static observations do not prove runtime access."
