name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run desktop:build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
      - run: npm run desktop:package -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cress-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.zip
          if-no-files-found: error
